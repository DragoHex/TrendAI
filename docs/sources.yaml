version: 2
registry_id: trendai-ai-sources

scope:
  domain: ai_trends
  focus: ai_research_product_engineering_and_community_signals
  primary_geography: global
  notes:
    - Initial seed set for AI trend ingestion.
    - Sources are canonicalized at the source level, not the individual document URL level.

policies:
  source_selection:
    strategy: official_first
    description: >
      Prefer publisher-owned APIs, feeds, and websites as the primary source of truth.
      Mirrors and aggregators may be used only for discovery or fallback.
  reliability_tiers:
    A: official publisher-owned source or official API
    B: reputable derived community or signal source
    C: mirror or aggregator used only as fallback or discovery aid
  access_method_precedence:
    - api
    - rss_or_atom
    - sitemap_or_index_page
    - html_index_page
    - article_page_scrape
  dedupe:
    canonical_key_order:
      - canonical_url
      - external_id
      - normalized_title_plus_published_at
    rules:
      - Document URLs must map to the parent source entry instead of creating new source entries.
      - Official sources always outrank mirrors for the same content.
      - Mirrors must not become the canonical publisher for a document.
  arxiv_defaults:
    filter_mode: category_query
    base_categories:
      - cs.AI
      - cs.LG
      - cs.CL
      - cs.CV
      - cs.RO
      - stat.ML
    optional_expansion_categories:
      - cs.MA
    optional_keyword_fields:
      - ti
      - abs
    sort_by: submittedDate
    sort_order: descending
    paging:
      max_results_per_call: 2000
      recommended_query_slice_size: 100
    caching:
      cache_identical_query_for: 24h
    polite_client_rules:
      min_delay_between_calls: 3s

source_schema:
  required_fields:
    - id
    - name
    - source_class
    - owner
    - homepage_url
    - access
    - schedule
    - reliability
    - content
    - filtering
    - dedupe
    - relationships
    - notes
  enums:
    source_class:
      - company_blog
      - research_blog
      - community_news
      - paper_feed
      - mirror_aggregator
    access_kind:
      - api
      - rss_or_atom
      - sitemap_or_index_page
      - html_index_page
      - article_page_scrape
    reliability_tier:
      - A
      - B
      - C
    filter_mode:
      - source_wide
      - keyword_match
      - keyword_or_downstream_classifier
      - category_query

sources:
  - id: hacker-news
    name: Hacker News
    source_class: community_news
    owner: Y Combinator
    homepage_url: https://news.ycombinator.com/news
    access:
      kind: api
      primary_url: https://hacker-news.firebaseio.com/v0/
      discovery_urls:
        - https://github.com/HackerNews/API
      fallback_urls:
        - https://hn.algolia.com/api
      request_defaults: {}
    schedule:
      cadence: near_real_time
    reliability:
      tier: B
      license_tos_notes: Use official public API when possible; treat as a community signal source.
    content:
      entity_type: story
      item_fields:
        - id
        - title
        - url
        - by
        - time
        - score
        - descendants
        - text
      tags:
        - ai
        - machine_learning
        - llms
        - agents
        - ai_coding
        - research
    filtering:
      mode: keyword_or_downstream_classifier
      seed_values:
        - ai
        - artificial intelligence
        - llm
        - language model
        - model
        - machine learning
        - ml
        - agent
        - coding
        - benchmark
        - inference
        - openai
        - anthropic
        - deepmind
        - gemini
      query_defaults: {}
    dedupe:
      primary_keys:
        - id
        - url
      canonical_preference: official_source
    relationships:
      fallback_source_ids: []
    notes:
      - Use the official API for item retrieval.
      - Use fallback URLs only for search, discovery, or backfill.

